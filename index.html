<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agro Tycoon 2.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🚜 Agro Tycoon <span>2.0</span></div>
    <div class="stats">
      <div class="stat"><span class="ico money"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/><path d="M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/></svg></span><div><small>Geld</small><b id="money">€0</b></div></div>
      <div class="stat"><span class="ico time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></span><div><small>Tijd</small><b id="clock">Dag 1</b></div></div>
      <div class="stat"><span class="ico weather"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.5"/><path d="M9 2.5v1.5M2.5 9H4M4.4 4.4l1 1M13.6 4.4l-1 1"/><path d="M8 20h9a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.6A2.8 2.8 0 0 0 8 20z"/></svg></span><div><small>Weer</small><b id="weather">☀️</b></div></div>
      <div class="stat"><span class="ico silo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V9a6 6 0 0 1 12 0v12"/><path d="M4 21h16M6 13h12M6 17h12"/><path d="M12 3v2"/></svg></span><div><small>Silo</small><b id="silo">0 t</b></div></div>
    </div>
    <div class="speed" role="group" aria-label="Spelsnelheid">
      <button data-speed="pause" title="Pauze (P)">⏸</button>
      <button data-speed="1" title="Normaal: 1 seconde = 1 minuut (toets 1)">1×</button>
      <button data-speed="5" title="5× zo snel (toets 2)">5×</button>
      <button data-speed="20" title="20× zo snel (toets 3)">20×</button>
      <button data-speed="60" title="60×: 1 seconde = 1 uur (toets 4)">60×</button>
    </div>
    <button id="sound-btn" class="icon-btn" data-open="sound" title="Geluid (M = dempen)">🔊</button>
    <button class="icon-btn" data-open="settings" title="Instellingen: opslaan, daglengte, toetsen, uitleg">⚙️</button>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div class="banner-row"><div id="goal" class="goal-banner" title="Klik voor alle doelen"></div><div id="forecast" class="forecast"></div></div>
      <div class="canvas-box"><canvas id="map" aria-label="Kaart van de boerderij"></canvas></div>
      <div id="log" class="log" aria-live="polite"></div>
    </section>

    <aside class="panel">
      <nav class="tabs">
        <button data-tab="field">Veld</button>
        <button data-tab="garage">Garage</button>
        <button data-tab="shop">Winkel</button>
        <button data-tab="team">Team</button>
        <button data-tab="farm">Bedrijf</button>
        <button data-tab="market">Markt</button>
        <button data-tab="money">Geld</button>
      </nav>
      <div id="tab-content" class="tab-content"></div>
    </aside>
  </main>

  <div id="modal" class="modal" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/staff.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/vehicle.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
