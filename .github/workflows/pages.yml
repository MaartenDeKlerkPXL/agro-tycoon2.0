# Zet het spel live op GitHub Pages bij elke push.
# Eenmalig nodig: Settings → Pages → Source: "GitHub Actions".
name: Deploy naar GitHub Pages

on:
  push:
    branches: ["claude/agro-tycoon-game-browser-lbcj9w", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site samenstellen
        run: |
          mkdir _site
          cp -r index.html css js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
